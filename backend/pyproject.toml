[project]
name = "breaking-law"
version = "0.1.0"
description = "AI powered API for legal document generation and automation"
authors = [
    {name = "Manuel Armillas",email = "marmillas@leitat.org"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.110.0,<0.111.0)",
    "sqlalchemy (>=2.0.0,<3.0.0)",
    "alembic (>=1.0.0,<2.0.0)",
    "asyncpg (>=0.29.0,<0.30.0)",
    "dramatiq[redis] (>=1.14.0,<2.0.0)",
    "redis (>=4.0.0,<5.0.0)",
    "boto3 (>=1.34.0,<2.0.0)",
    "pypdf (>=4.0.0,<5.0.0)",
    "python-docx (>=0.8.11,<0.9.0)",
    "pytesseract (>=0.3.10,<0.4.0)",
    "pdf2image (>=1.17.0,<2.0.0)",
    "pillow (>=10.0.0,<11.0.0)",
    "python-multipart (>=0.0.7,<0.1.0)",
    "python-jose[cryptography] (>=3.3.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "pgvector (>=0.2.0,<0.5.0)",
    "openai (>=1.0.0,<2.0.0)",
    "httpx (>=0.27.0,<0.28.0)",
    "email-validator (>=2.1.0,<3.0.0)"
]


[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
aiosqlite = "^0.20.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
